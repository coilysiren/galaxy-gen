[tool.agentic-os.documentation-layout]
# Large, not small. 40 docs against the small band's 20-doc cap was never
# reachable without deleting half of them, and the per-subsystem docs run to 80
# lines against the large cap of 120. A sweep stamped small fleet-wide during
# the agentic-os#1108 rollout; Kai re-picked per repo.
band = "large"
# Not debt, and #78 measured each one. docs/journal/perf-rewrite.md is a
# chronological engineering journal; no split satisfies a size cap without
# shredding it, so it lives in a journal tree sized by what it accumulates. The .agents/skills entries fail a cap their own spec disclaims -
# tooling-skill-authoring says SKILL.md is capped at 500 lines / 10 KB and
# "Reference files are not capped" - so two validators disagree and the fix
# is upstream. pkg/** is generated wasm-pack output.
# The journal is a chronological record rather than a reference page, so its
# size belongs to the history it accumulates. `excludes` reaches placement only.
size_excludes = ["docs/journal/"]
excludes = [
  "docs/journal/**",
  ".agents/skills/coding-galaxy-gen-astrophysics/SKILL.md",
  ".agents/skills/coding-galaxy-gen-astrophysics/references/wikipedia-concepts.md",
  ".agents/skills/coding-galaxy-gen-cosmology/SKILL.md",
  ".agents/skills/coding-galaxy-gen-cosmology/references/wikipedia-concepts.md",
  ".agents/skills/coding-galaxy-gen-references/SKILL.md",
  ".agents/skills/tooling-skill-authoring/SKILL.md",
  ".agents/skills/tooling-skill-authoring/references/handbook.md",
  "pkg/**",
]

[tool.agentic-os.code-comments]
# Operational YAML whose inline comments explain the key they sit beside;
# hoisting them to a header would strip that locality. These duplicate
# .agentic-os.toml but are NOT dead - removing them turns the suite red in
# all four files (#78). See galaxy-gen#24 for the original rationale.
excludes = [
  ".agents/skills/categories.yaml",
  ".github/workflows/action.yml",
  ".github/workflows/trufflehog.yml",
  ".pre-commit-config.yaml",
]

[tool.agentic-os.dead-cross-links]
# wasm-pack copies the root README into generated pkg/. Cleanup: #46.
excludes = ["pkg/**"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-gaming"
