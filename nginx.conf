# galaxy-gen: static site served by unprivileged nginx (Dockerfile stage 2,
# replaces /etc/nginx/conf.d/default.conf). TLS is terminated upstream by
# traefik + cert-manager in the k3s cluster; this server speaks plain HTTP on
# 8080 (nginx-unprivileged's default) and trusts the ingress. Carries over the
# retired Caddyfile's behavior: wasm MIME + streaming-instantiation, immutable
# caching for hashed bundles, revalidated index.html, /healthz for probes.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the text/wasm payloads (upstream nginx.conf leaves gzip off).
    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length 1024;

    # .wasm must be application/wasm so browsers stream-instantiate it
    # (otherwise Chrome falls back to a slower path). The alpine image's
    # mime.types already maps it; this pins the behavior explicitly.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Liveness/readiness endpoint for k8s probes.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Hashed bundle filenames are immutable; cache them aggressively.
    # (location-level add_header replaces the server-level set, so the
    # security headers repeat wherever a location adds its own.)
    location ~* "\.[0-9a-f]{8,}\." {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must revalidate so fresh deploys land immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA-style fallback: unknown paths serve index.html (no client routing
    # today, but this keeps things sane if we add one later).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
