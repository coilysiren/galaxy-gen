# Pin the toolchain so the lint gate means the same thing everywhere.
#
# CI once installed whatever stable rustup served that day, so before this file
# it drifted ahead of every developer machine. The clippy gate landed in that
# state and main went red on the same commit that added it: 1.97 emits
# `unnecessary_cast` on ten `col_row_to_index(..) as usize` calls that 1.94 says
# nothing about, and `-D warnings` turns any new lint into a hard failure.
# rustfmt output moves between releases too, so `cargo fmt --check` had the same
# exposure.
#
# A floating toolchain plus a deny-by-default gate means any Rust release can
# break main with no commit of ours involved. Pinning makes toolchain upgrades
# a deliberate change that arrives with its own fallout fixed in the same
# commit.
#
# CI and the image build now both run in dev-base, whose own default toolchain
# is `stable`. This pin is what keeps that from mattering: rustup honours it on
# the first cargo call in any environment, so the gate still judges the exact
# compiler that builds the deployed artifact. Bumping it costs one toolchain
# download per build until dev-base's default catches up, which is the trade we
# want in that direction. Bump it, then run `ward exec lint-rust`.
[toolchain]
channel = "1.90.0"
components = ["clippy", "rustfmt"]
