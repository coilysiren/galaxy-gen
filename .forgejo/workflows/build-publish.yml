name: build-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: just ci-setup
      - run: just lint-rust
      - run: just test-rust
      - run: just check-js
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py

  publish:
    needs: test
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Publish immutable galaxy-gen image
        run: bash scripts/publish-image.sh
