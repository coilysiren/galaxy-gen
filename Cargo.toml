# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "galaxy_gen_backend"
description = "{ rust => wasm => js } galaxy generation simulation"
repository = "https://forgejo.coilysiren.me/coilyco-gaming/galaxy-gen"
version = "0.0.1"
authors = ["Kai Siren"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/rust/lib.rs"

[[bin]]
name = "tick_bench"
path = "benches/tick_bench.rs"

[[bin]]
name = "debug_sim"
path = "benches/debug_sim.rs"

[[bin]]
name = "perf_profile"
path = "benches/perf_profile.rs"

[dependencies]
console_error_panic_hook = "^0.1"
wasm-bindgen = "^0.2"
getrandom = { version = "^0.4", features = ["wasm_js"] }
rand = "^0.10"

# The scenario tests integrate real galaxies for a thousand ticks, so an
# unoptimized test binary is the difference between a suite that runs in
# under a minute and one nobody waits for. Optimizing the test profile
# keeps debug assertions and overflow checks on - it trades compile time
# for run time, not for safety. Rust does not enable fast-math, so f32
# results are identical across opt levels and the golden hashes hold; the
# golden mass field test is what proves that stays true.
[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Re-enable wasm-opt with an explicit, conservative flag set. The earlier
# `failed to grow table by 4` error was caused by the unused `specs` crate
# dragging rayon/atomic_refcell/etc into the bundle, not by wasm-opt
# itself. With specs removed, -O3 runs clean.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory"]
